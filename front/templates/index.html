<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轻松食 · 智能营养助手</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>🥗 轻松食 · 营养问答</h1>
            <p>问我任何关于食物热量、餐食搭配的问题</p>
            <div class="auth-bar" id="authBar">
                <input type="text" id="usernameInput" placeholder="用户名">
                <input type="password" id="passwordInput" placeholder="密码">
                <button type="button" id="loginBtn">登录</button>
                <button type="button" id="registerBtn">注册</button>
                <button type="button" id="logoutBtn" hidden>退出</button>
                <span id="authStatus"></span>
            </div>
        </header>
        <div class="conversation-toolbar">
            <button type="button" id="newConversationBtn">新建会话</button>
            <select id="conversationSelect" aria-label="历史会话">
                <option value="">当前会话</option>
            </select>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="avatar">🤖</div>
                <div class="content">你好！我是你的营养助手，可以帮你查询食物热量、推荐餐食组合。有什么可以帮你的吗？</div>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="questionInput" placeholder="输入你的问题...（例如：鸡胸肉的热量）" autofocus>
            <button id="sendBtn">发送</button>
        </div>
    </div>
    <script src="/static/script.js?v=0.7.0-small-platform"></script>
</body>
</html>
