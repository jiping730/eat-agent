<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的知识 · 轻松食</title>
    <link rel="stylesheet" href="/static/style.css?v=p2-3">
</head>
<body class="knowledge-page">
    <main class="knowledge-container">
        <header class="knowledge-header">
            <div>
                <p class="eyebrow">P2-3 · PERSONAL KNOWLEDGE</p>
                <h1>我的知识</h1>
                <p>导入只属于你的 TXT/Markdown 笔记，回答时会优先参考这些内容。</p>
            </div>
            <a class="back-link" href="/">返回对话</a>
        </header>

        <section class="knowledge-card">
            <h2>导入文档</h2>
            <p>支持 UTF-8 编码的 .txt / .md；文件内容只会进入当前用户的个人知识索引。</p>
            <div class="form-grid">
                <label>标题 <input id="personalKnowledgeTitle" type="text" maxlength="200" placeholder="默认使用文件名"></label>
                <label>文件 <input id="personalKnowledgeFile" type="file" accept=".txt,.md,text/plain,text/markdown"></label>
            </div>
            <textarea id="personalKnowledgeContent" rows="10" placeholder="也可以直接粘贴个人笔记内容"></textarea>
            <button id="importPersonalKnowledge" class="primary-action" type="button">导入并构建索引</button>
            <span id="personalKnowledgeStatus" class="knowledge-status"></span>
        </section>

        <section class="knowledge-card">
            <div class="section-heading">
                <div>
                    <h2>我的文档</h2>
                    <p id="personalKnowledgeSummary">正在加载…</p>
                </div>
                <button id="refreshPersonalKnowledge" type="button">刷新</button>
            </div>
            <div id="personalKnowledgeDocuments" class="knowledge-table-wrap"></div>
        </section>

        <section class="knowledge-card">
            <h2>检索调试</h2>
            <p>只展示当前用户自己的命中文档、片段、版本和分数。</p>
            <textarea id="personalKnowledgeQuery" rows="4" placeholder="例如：我的减脂目标是什么？"></textarea>
            <button id="testPersonalKnowledge" type="button">测试检索</button>
            <pre id="personalKnowledgeResult" class="retrieval-result"></pre>
        </section>
    </main>
    <script src="/static/personal_knowledge.js?v=p2-3"></script>
</body>
</html>
