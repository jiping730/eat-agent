apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eat-agent.fullname" . }}
  labels:
    {{- include "eat-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "eat-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eat-agent.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 45
      serviceAccountName: {{ include "eat-agent.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: eat-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "eat-agent.fullname" . }}-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "eat-agent.secretName" . }}
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "eat-agent.secretName" . }}
                  key: JWT_SECRET
            - name: ZHIPUAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "eat-agent.secretName" . }}
                  key: ZHIPUAI_API_KEY
                  optional: true
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "eat-agent.secretName" . }}
                  key: TAVILY_API_KEY
                  optional: true
            - name: APP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "eat-agent.secretName" . }}
                  key: APP_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
