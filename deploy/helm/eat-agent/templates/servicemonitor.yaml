{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "eat-agent.fullname" . }}
  labels:
    {{- include "eat-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "eat-agent.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      bearerTokenSecret:
        name: {{ include "eat-agent.secretName" . }}
        key: METRICS_API_KEY
{{- end }}
