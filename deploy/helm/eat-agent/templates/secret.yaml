{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eat-agent.secretName" . }}
  labels:
    {{- include "eat-agent.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ required "secrets.data.databaseUrl is required when secrets.create=true" .Values.secrets.data.databaseUrl | b64enc | quote }}
  JWT_SECRET: {{ required "secrets.data.jwtSecret is required when secrets.create=true" .Values.secrets.data.jwtSecret | b64enc | quote }}
  METRICS_API_KEY: {{ required "secrets.data.metricsApiKey is required when secrets.create=true" .Values.secrets.data.metricsApiKey | b64enc | quote }}
  ZHIPUAI_API_KEY: {{ .Values.secrets.data.zhipuaiApiKey | b64enc | quote }}
  TAVILY_API_KEY: {{ .Values.secrets.data.tavilyApiKey | b64enc | quote }}
  APP_API_KEY: {{ .Values.secrets.data.appApiKey | b64enc | quote }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.secrets.data.langfusePublicKey | b64enc | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.secrets.data.langfuseSecretKey | b64enc | quote }}
{{- end }}
