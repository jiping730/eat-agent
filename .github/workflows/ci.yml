name: ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Check whitespace
        run: git diff --check
      - name: Run tests
        env:
          DATABASE_URL: sqlite:////tmp/eat-agent-ci.db
          AUTO_CREATE_SCHEMA: "true"
          REDIS_URL: ""
        run: pytest -q -m "not e2e" --cov=core.grill_engine --cov=core.intent_router --cov=core.workflow --cov=core.conversation_runtime --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install ".[dev]"
      - name: Ruff
        run: ruff check core front agent rag mcp_servers utils --exclude '*.pyc'
      - name: Black
        run: black --check core/contracts.py core/intent_router.py core/workflow.py core/conversation_runtime.py rag/ingestion.py rag/retriever.py
      - name: isort
        run: isort --check-only core/contracts.py core/intent_router.py core/conversation_runtime.py rag/ingestion.py rag/retriever.py
      - name: Mypy
        run: mypy core/contracts.py core/intent_router.py core/grill_engine.py core/conversation_runtime.py rag/ingestion.py rag/retriever.py

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install project and browser test dependencies
        run: python -m pip install ".[dev,e2e]"
      - name: Build React frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start local application
        env:
          DATABASE_URL: sqlite:////tmp/eat-agent-e2e.db
          AUTO_CREATE_SCHEMA: "true"
          REDIS_URL: ""
          APP_ENV: development
        run: |
          nohup uvicorn front.app:app --host 127.0.0.1 --port 5000 >/tmp/eat-agent-e2e.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5000/healthz && break
            sleep 1
          done
      - name: Run browser E2E
        env:
          RUN_BROWSER_E2E: "1"
          E2E_BASE_URL: http://127.0.0.1:5000
          DATABASE_URL: sqlite:////tmp/eat-agent-e2e.db
          AUTO_CREATE_SCHEMA: "true"
          REDIS_URL: ""
        run: pytest -q -m e2e tests/test_browser_e2e.py

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and render Helm chart
        run: |
          docker run --rm \
            --entrypoint sh \
            -v "$PWD:/work" \
            -w /work \
            alpine/helm:3.17.0 \
            -c 'helm lint deploy/helm/eat-agent && helm template eat-agent deploy/helm/eat-agent >/tmp/eat-agent-rendered.yaml'

  image:
    runs-on: ubuntu-latest
    needs: [test, quality, browser-e2e, helm]
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable CI image
        run: docker build --pull -t eat-agent:${{ github.sha }} .
      - name: Scan image for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: eat-agent:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
