name: ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Check whitespace
        run: git diff --check
      - name: Run tests
        run: pytest -q

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and render Helm chart
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine/helm:3.17.0 \
            sh -c 'helm lint deploy/helm/eat-agent && helm template eat-agent deploy/helm/eat-agent >/tmp/eat-agent-rendered.yaml'

  image:
    runs-on: ubuntu-latest
    needs: [test, helm]
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable CI image
        run: docker build --pull -t eat-agent:${{ github.sha }} .
      - name: Scan image for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: eat-agent:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
