[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "1.0.0"
description = "Agentic RAG 智能营养问答系统"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langchain>=1.2.0,<2.0",
    "langchain-community>=0.4.0,<1.0",
    "langchain-core>=1.2.22,<2.0",
    "langchain-text-splitters>=1.1.0,<2.0",
    "faiss-cpu==1.8.0",
    "filelock>=4.2.1,<5.0",
    "numpy>=1.26.2,<2.0",
    "python-dotenv==1.0.1",
    "sniffio>=1.3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.4,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "gunicorn>=22,<24",
    "PyJWT>=2.14.0,<3.0",
    "redis>=5.0,<6.0",
    "prometheus-client>=0.20,<1.0",
    "litellm>=1.100.4,<2.0",
    "mcp>=1.28.1,<2.0",
    "neo4j>=5.0.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]==0.54.0",
    "jinja2>=3.1,<4.0",
    "werkzeug>=3.1,<4.0",
    "langgraph>=1.1.0,<2.0",
    "tavily-python>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]
e2e = [
    "playwright>=1.45,<2.0",
    "pytest-playwright>=0.5,<1.0",
]
eval = [
    "ragas>=0.2.0",
    "datasets",
    "pandas",
]
observability = [
    "opentelemetry-api>=1.25,<2.0",
    "opentelemetry-sdk>=1.25,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2.0",
    "langfuse>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/agentic-rag"
Repository = "https://github.com/yourusername/agentic-rag.git"
Issues = "https://github.com/yourusername/agentic-rag/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "rag*", "core*", "utils*", "mcp_servers*", "front*"]
exclude = ["tests", "evaluation", "data", "faiss_index", "logs"]

# 可选工具配置
[tool.black]
line-length = 120
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The MCP stdio entrypoint must bootstrap the repository path before imports.
"mcp_servers/local_server.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
markers = [
    "e2e: browser end-to-end tests requiring a running local server",
    "security: security and prompt-injection regression tests",
    "concurrency: multi-request and idempotency regression tests",
]

[tool.coverage.run]
branch = true
source = [
    "core.grill_engine",
    "core.intent_router",
    "core.workflow",
    "core.conversation_runtime",
]
omit = [
    "*/__init__.py",
    "*/__main__.py",
    "*/static/*",
    "*/templates/*",
]

[tool.coverage.report]
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]
show_missing = true
skip_covered = true
